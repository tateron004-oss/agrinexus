<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#04070d">
  <title>Nexus Genesis</title>
  <link rel="stylesheet" href="./nexus-clean.css">
  <link rel="stylesheet" href="./nexus-content-population-extension.css">
  <link rel="stylesheet" href="./vendor/leaflet/leaflet.css">
</head>
<body>
  <main class="genesis" aria-label="Nexus Genesis">
    <p id="nexus-greeting" class="greeting">Hello Ron, how can I help?</p>
    <button id="nexus-orb" class="orb" type="button" aria-label="Speak to Nexus" aria-pressed="false">
      <span class="orb-core" aria-hidden="true"></span>
      <svg class="orb-microphone" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a1 1 0 1 0-2 0 3 3 0 0 1-6 0 1 1 0 1 0-2 0 5 5 0 0 0 4 4.9V18H8a1 1 0 1 0 0 2h8a1 1 0 1 0 0-2h-3v-2.1A5 5 0 0 0 17 11Z"/>
      </svg>
    </button>
    <p id="nexus-status" class="status" role="status" aria-live="polite">Tap the microphone to start</p>
    <p id="nexus-caption" class="caption" aria-live="polite" hidden></p>
    <details id="nexus-preferences" class="preferences">
      <summary aria-label="Open voice preferences" title="Voice preferences"><span aria-hidden="true">⚙</span></summary>
      <fieldset id="nexus-controls" class="controls" aria-label="Nexus voice preferences">
      <legend>Voice preferences</legend>
      <label>
        <input id="nexus-captions" type="checkbox" checked>
        Captions
      </label>
      <label>
        <input id="nexus-slow-speech" type="checkbox">
        Slower speech
      </label>
      <label class="volume-control" for="nexus-volume">Volume
        <input id="nexus-volume" type="range" min="0" max="100" value="100">
      </label>
      <button id="nexus-replay" type="button" disabled>Replay response</button>
      </fieldset>
    </details>
    <section id="nexus-workspace" class="workspace" aria-live="polite" hidden>
      <header class="workspace-bar">
        <div class="workspace-listening" aria-live="polite">
          <span class="workspace-orb" aria-hidden="true"></span>
          <span id="nexus-workspace-voice-status">Nexus is listening in the background</span>
        </div>
        <button id="nexus-workspace-close" class="workspace-close" type="button" aria-label="Close workspace">Close</button>
      </header>
      <div class="workspace-content">
        <h1 id="nexus-workspace-title"></h1>
        <p id="nexus-workspace-command"></p>
        <div id="nexus-map-surface" class="map-surface" hidden>
          <div id="nexus-map-canvas" role="img" aria-label="Map displayed by Nexus"></div>
          <p id="nexus-map-summary" class="map-summary" aria-live="polite"></p>
          <a id="nexus-map-link" target="_blank" rel="noopener noreferrer">Open full map</a>
        </div>
        <div id="nexus-app-surface" class="app-surface" hidden></div>
        <div id="nexus-evidence-surface" class="evidence-surface" hidden></div>
        <div id="nexus-music-surface" class="music-surface" hidden>
          <iframe
            id="nexus-music-frame"
            title="Music played by Nexus"
            loading="eager"
            allow="autoplay; encrypted-media; picture-in-picture"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>
          <a id="nexus-music-link" target="_blank" rel="noopener noreferrer">Open music player</a>
        </div>
        <form id="nexus-guided-entry" class="guided-entry" aria-label="Type information for the active Nexus process">
          <label for="nexus-guided-entry-command">Speak or type naturally</label>
          <div class="guided-entry-row">
            <input id="nexus-guided-entry-command" name="command" autocomplete="off"
              placeholder="Example: Add 50 bags to quantity">
            <button type="submit">Update</button>
          </div>
        </form>
      </div>
    </section>
    <audio id="nexus-audio" autoplay></audio>
  </main>
  <script>window.NEXUS_CLEAN_CONFIG = window.NEXUS_CLEAN_CONFIG || {};</script>
  <script src="./vendor/leaflet/leaflet.js"></script>
  <script src="./nexus-clean.bundle.js" defer></script>
  <script src="./nexus-content-population-extension.js" defer></script>
</body>
</html>
