name: Apply Nexus Build 504
on:
  push:
    paths:
      - .github/workflows/apply-nexus-build-504.yml
permissions:
  contents: write
jobs:
  apply-build-504:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact Build 504 patch
        shell: bash
        env:
          BUILD_504_PATCH_B64: 
        run: |
          printf '%s' "$BUILD_504_PATCH_B64" | base64 --decode > /tmp/build-504.patch
          git apply --check /tmp/build-504.patch
          git apply /tmp/build-504.patch
          git diff --check
      - name: Run microphone and voice certification
        shell: bash
        run: |
          node scripts/nexus-realtime-microphone-visibility-qa.js
          node scripts/nexus-production-audio-pipeline-qa.js
          node scripts/nexus-genesis-browser-voice-acceptance-qa.js
          node scripts/nexus-genesis-persistent-voice-lifecycle-qa.js
          node scripts/nexus-genesis-realtime-repeated-turn-lifecycle-qa.js
          node scripts/nexus-genesis-truthful-voice-state-qa.js
          node scripts/nexus-service-worker-cache-safety-qa.js
      - name: Publish Build 504
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/index.html public/sw.js server.js scripts
          git commit -m "Fix Nexus microphone device diagnostics"
          git push origin HEAD:main
