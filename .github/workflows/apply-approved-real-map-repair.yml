name: Apply approved real map repair
on:
  push:
    paths:
      - ".github/workflows/apply-approved-real-map-repair.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply-real-map-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply and verify reviewed repair
        run: node scripts/apply-approved-real-map-repair.js
      - name: Publish verified repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js scripts/nexus-genesis-voice-workspace-bridge-qa.js tests/playwright/nexus-workspace-action.spec.js
          git diff --cached --quiet && { echo "No repair was produced."; exit 1; }
          git commit -m "Open real map from Realtime voice commands"
          git push origin HEAD:main
# Approved dispatch for Maps repair 9c74529
