name: Retired Build 488 corruption repair

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-retired-repair:
    name: Confirm the obsolete repair remains retired
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main
        uses: actions/checkout@v4

      - name: Verify current release supersedes Build 488
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'AGRINEXUS_WEB_BUILD_VERSION = "nexus-behavior-502"' server.js
          grep -F 'AGRINEXUS_BUILD_VERSION = "nexus-behavior-502"' public/app.js
          echo "Build 488 emergency mutation is retired; Build 502 is authoritative."
