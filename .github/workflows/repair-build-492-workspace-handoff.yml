name: Repair Nexus build 492 workspace handoff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-build-492-workspace-handoff.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Repair shared voice workspace handoff
        run: |
          node -e 'const fs=require("fs");let s=fs.readFileSync("public/app.js","utf8");const re=/  if \(workspace !== "map" && document\.body\.classList\.contains\("user-map-full-open"\)\) \{[\s\S]*?source: "realtime-workspace-transition"[\s\S]*?\n  \}/;if(!re.test(s))throw new Error("build 491 rerender block missing");s=s.replace(re,`  if (workspace !== "map" && document.body.classList.contains("user-map-full-open")) {\n    document.body.classList.remove("user-map-full-open");\n  }`);fs.writeFileSync("public/app.js",s)'
          find public scripts -type f \( -name "*.js" -o -name "*.html" -o -name "*.txt" \) -print0 | xargs -0 sed -i 's/nexus-behavior-491/nexus-behavior-492/g; s/agrinexus-pwa-v436/agrinexus-pwa-v437/g'
          sed -i 's/nexus-behavior-491/nexus-behavior-492/g; s/agrinexus-pwa-v436/agrinexus-pwa-v437/g' server.js
      - name: Validate protected runtime
        run: |
          node --check server.js
          node --check public/app.js
          node scripts/nexus-genesis-voice-workspace-bridge-qa.js
          node scripts/nexus-realtime-microphone-visibility-qa.js
          node scripts/nexus-genesis-persistent-voice-lifecycle-qa.js
          node scripts/nexus-service-worker-cache-safety-qa.js
      - name: Publish repaired build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public server.js scripts
          git commit -m "Restore Nexus voice workspace acknowledgements"
          git push origin main
