name: Nexus Render exact-release deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-render-production-deployment
  cancel-in-progress: false

env:
  NEXUS_CANONICAL_PRODUCTION_URL: https://agrinexus-platform.onrender.com
  NEXUS_EXPECTED_RELEASE_SHA: ${{ github.sha }}
  NEXUS_EXPECTED_BUNDLE: rebuild/browser/nexus-clean.bundle.js

jobs:
  deploy-and-verify:
    name: Deploy and verify exact Render release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify deployment automation contract
        run: node rebuild/tests/nexus-render-deployment-orchestration.test.js
      - name: Trigger existing Render service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_AGRINEXUS_PLATFORM_SERVICE_ID: ${{ secrets.RENDER_AGRINEXUS_PLATFORM_SERVICE_ID }}
        run: node scripts/nexus-render-deploy.js
      - name: Verify exact deployed release
        env:
          NEXUS_DEPLOYMENT_TIMEOUT_MS: "900000"
        run: node scripts/nexus-release-certification-controller.js verify-deployment
      - name: Publish deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-render-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/nexus-release-certification/
          if-no-files-found: warn
          retention-days: 90
