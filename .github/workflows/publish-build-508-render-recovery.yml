name: Publish Build 508 Render recovery

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-build-508-render-recovery.yml

permissions:
  contents: write

concurrency:
  group: publish-build-508-render-recovery
  cancel-in-progress: false

jobs:
  repair-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore intact Build 507 runtime sources
        shell: bash
        run: |
          git show 9e30da8834c6da1eed6e4c82c435bb45a7853694:server.js > server.js
          git show 9e30da8834c6da1eed6e4c82c435bb45a7853694:public/app.js > public/app.js

      - name: Apply tested Build 508 repair
        shell: python
        run: |
          from pathlib import Path

          server = Path("server.js")
          text = server.read_text(encoding="utf-8")
          text = text.replace('const AGRINEXUS_WEB_BUILD_VERSION = "nexus-behavior-507";', 'const AGRINEXUS_WEB_BUILD_VERSION = "nexus-behavior-508";', 1)
          text = text.replace('const AGRINEXUS_PWA_CACHE_VERSION = "agrinexus-pwa-v452";', 'const AGRINEXUS_PWA_CACHE_VERSION = "agrinexus-pwa-v453";', 1)
          server.write_text(text, encoding="utf-8")

          app = Path("public/app.js")
          text = app.read_text(encoding="utf-8")
          text = text.replace('const AGRINEXUS_BUILD_VERSION = "nexus-behavior-507";', 'const AGRINEXUS_BUILD_VERSION = "nexus-behavior-508";', 1)
          text = text.replace('const AGRINEXUS_PWA_CACHE_VERSION = "agrinexus-pwa-v452";', 'const AGRINEXUS_PWA_CACHE_VERSION = "agrinexus-pwa-v453";', 1)

          start = 'async function startOpenAiAgentsRealtimeVoiceSession(status = {}, options = {}) {\n  const sessionId = `rt-sdk-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;'
          replacement = start + '''\n  const preverifiedMicrophoneStream = options.preverifiedMicrophoneStream
            || nexusPermanentMicrophoneStream
            || nexusVoicePermissionStream
            || null;
          const preverifiedMicrophoneProof = verifyNexusPermanentMicrophoneStream(preverifiedMicrophoneStream);
          if (!preverifiedMicrophoneProof.ok) {
            throw new Error("Nexus Realtime requires one live preverified microphone stream.");
          }'''
          if start not in text:
              raise SystemExit("Realtime session boundary not found")
          text = text.replace(start, replacement, 1)
          text = text.replace('preverifiedMicrophoneStream: options.preverifiedMicrophoneStream || null,', 'preverifiedMicrophoneStream,', 1)
          text = text.replace('if (!options.preverifiedMicrophoneStream || nexusVoicePermissionStream !== options.preverifiedMicrophoneStream) {', 'if (!preverifiedMicrophoneStream || nexusVoicePermissionStream !== preverifiedMicrophoneStream) {', 1)
          app.write_text(text, encoding="utf-8")

      - name: Validate recovered Render source
        shell: bash
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --check server.js
          node --check public/app.js
          npm run build:nexus-openai-realtime-agent
          npm run qa:nexus-openai-realtime-microphone-handoff
          npm run qa:nexus-realtime-microphone-visibility
          npm run qa:nexus-genesis-persistent-voice-lifecycle
          npm run qa:nexus-service-worker-cache-safety
          test "$(wc -l < server.js)" -gt 48000
          test "$(wc -l < public/app.js)" -gt 61000
          git checkout -- package-lock.json public/vendor/nexus-openai-realtime-agent.bundle.mjs
          git diff --check -- server.js public/app.js

      - name: Publish recovery and remove publisher
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/publish-build-508-render-recovery.yml
          git add server.js public/app.js
          git commit -m "Repair corrupted Build 508 deployment sources"
          git push origin HEAD:main
