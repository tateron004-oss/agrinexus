name: Mirror pgvector database image

# Copies pgvector/pgvector:pg17 from Docker Hub into this repository's GitHub registry (ghcr.io), which has no anonymous pull limit,
# so "Prove release candidate before production" no longer depends on Docker Hub. Run it by hand (Actions -> this workflow -> Run workflow)
# to refresh the copy. It retries for up to 40 minutes because Docker Hub's limit on GitHub's shared machines comes and goes.
on:
  workflow_dispatch:
  push:
    branches:
      - fix/mirror-pgvector-image
    paths:
      - .github/workflows/mirror-pgvector-image.yml
      - .github/mirror/pgvector.Dockerfile

permissions:
  contents: read
  packages: write

concurrency:
  group: mirror-pgvector-image
  cancel-in-progress: false

jobs:
  mirror:
    name: Copy the image into ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source without retained credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and push, retrying while Docker Hub's pull limit is hit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          owner="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          image="ghcr.io/${owner}/agrinexus-pgvector:pg17"
          echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          for attempt in $(seq 1 40); do
            if docker build --pull -f .github/mirror/pgvector.Dockerfile -t "${image}" .github/mirror && docker push "${image}"; then
              echo "Pushed ${image} on attempt ${attempt}"
              docker image inspect "${image}" --format 'base image id: {{.Id}}'
              exit 0
            fi
            echo "Attempt ${attempt} failed (most likely Docker Hub's pull limit); waiting 60 seconds"
            sleep 60
          done
          echo "Could not copy the image after 40 attempts"
          exit 1
