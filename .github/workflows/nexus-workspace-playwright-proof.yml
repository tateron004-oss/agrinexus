name: Nexus Workspace Playwright Proof

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/nexus-workspace-playwright-proof.yml
      - scripts/nexus-genesis-live-provider-browser-smoke.js
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed Nexus URL to verify
        required: true
        default: https://agrinexus-platform.onrender.com

permissions:
  contents: read

concurrency:
  group: nexus-production-realtime-owner
  cancel-in-progress: false

jobs:
  deployed-workspace-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXUS_LIVE_BASE_URL: ${{ inputs.base_url || 'https://agrinexus-platform.onrender.com' }}
    steps:
      - name: Check out exact repository state
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.1
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --no-package-lock @playwright/test@1.61.1
          npx playwright install --with-deps chromium

      - name: Install synthetic speech support
        run: sudo apt-get install -y ffmpeg libflite1

      - name: Verify Build 500 production markers
        run: npm run qa:nexus-genesis-production-exact-build-smoke

      - name: Certify all spoken production workflows
        env:
          NEXUS_LIVE_EXPECTED_TURNS: "18"
          NEXUS_LIVE_REQUIRE_WORKSPACES: "1"
          NEXUS_LIVE_REQUIRED_INTERRUPTION_COUNT: "0"
        run: |
          export CHROME_PATH="$(node -e "process.stdout.write(require('playwright').chromium.executablePath())")"
          npm run qa:nexus-genesis-live-provider-browser-smoke

      - name: Require complete structured voice evidence
        run: |
          node -e 'const {readAndValidateEvidence}=require("./scripts/nexus-live-voice-evidence"); readAndValidateEvidence("output/nexus-live-voice-acceptance/live-provider-browser-evidence.json", Number(process.env.NEXUS_LIVE_EXPECTED_TURNS));'

      - name: Publish workspace voice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-workspace-voice-evidence-${{ github.run_id }}
          path: output/nexus-live-voice-acceptance/
          if-no-files-found: error
          retention-days: 30

# Build 505 serialized certification trigger.
