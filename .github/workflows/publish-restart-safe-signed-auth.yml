name: Publish restart-safe signed authentication

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-restart-safe-signed-auth.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Apply authorized server authentication update
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/restart-safe-auth.patch
          git apply --index /tmp/restart-safe-auth.patch
          git diff --cached --check
      - name: Install dependencies
        run: npm ci
      - name: Verify authentication and protected foundation
        env:
          SESSION_SECRET: nexus-ci-restart-safe-auth-verification
        run: |
          node --check server.js
          npm run auth:login-api-smoke
          npm run auth:login-gate-qa
          node scripts/nexus-protected-foundation-guard.js
          node scripts/nexus-genesis-persistent-voice-lifecycle-qa.js
      - name: Publish verified atomic repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm ".github/workflows/publish-restart-safe-signed-auth.yml"
          git commit -m "Add restart-safe signed authentication"
          git push origin HEAD:main
