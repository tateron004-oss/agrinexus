name: Publish Nexus Build 509

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-nexus-build-509.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply exact tested Build 509 patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/nexus-build-509.patch
          git apply --index /tmp/nexus-build-509.patch
          git diff --cached --check
      - name: Install dependencies
        run: npm ci
      - name: Verify Build 509
        run: |
          node --check public/app.js
          node --check server.js
          node scripts/nexus-youtube-music-playback-qa.js
          node scripts/nexus-openai-realtime-microphone-handoff-qa.js
          node scripts/nexus-realtime-microphone-visibility-qa.js
          node scripts/nexus-genesis-persistent-voice-lifecycle-qa.js
          node scripts/nexus-service-worker-cache-safety-qa.js
          node scripts/qa-suite.js all-safe
      - name: Publish exact verified Build 509
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm ".github/workflows/publish-nexus-build-509.yml"
          git commit -m "Complete provider voice evidence routing"
          git push origin HEAD:main
