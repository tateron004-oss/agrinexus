name: Nexus deterministic release certification

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/nexus-genesis-clean-foundation
  pull_request:
    branches:
      - rebuild/nexus-genesis-clean-foundation

permissions:
  contents: read

concurrency:
  group: nexus-deterministic-release-certification
  cancel-in-progress: true

env:
  NEXUS_CLEAN_BASE_URL: https://nexus-genesis-certified.onrender.com
  NEXUS_EXPECTED_RELEASE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  NEXUS_EXPECTED_BUNDLE: rebuild/browser/nexus-clean.bundle.js

jobs:
  deploy-exact-release:
    name: Deploy exact frozen release
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Invoke secure Render deploy hook for exact SHA
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $hook = [Environment]::GetEnvironmentVariable("NEXUS_RENDER_DEPLOY_HOOK_URL", "User")
          if (-not $hook) {
            $hook = [Environment]::GetEnvironmentVariable("NEXUS_RENDER_DEPLOY_HOOK_URL", "Machine")
          }
          if (-not $hook) {
            throw "Secure Render deploy hook is unavailable to the Windows control plane."
          }
          $builder = [System.UriBuilder]::new($hook)
          $existingQuery = $builder.Query.TrimStart("?")
          $exactRef = "ref=$([System.Uri]::EscapeDataString($env:NEXUS_EXPECTED_RELEASE_SHA))"
          $builder.Query = if ($existingQuery) { "$existingQuery&$exactRef" } else { $exactRef }
          Invoke-WebRequest -Method Post -Uri $builder.Uri -TimeoutSec 30 -UseBasicParsing | Out-Null
          Write-Host "Requested exact Render release $env:NEXUS_EXPECTED_RELEASE_SHA."

  release-identity:
    name: Exact deployed release identity
    needs: deploy-exact-release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify controller contracts
        run: node rebuild/tests/nexus-release-certification-controller.test.js
      - name: Wait for exact Render release
        run: node scripts/nexus-release-certification-controller.js verify-deployment
      - name: Publish release identity
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-release-identity-${{ github.run_id }}
          path: output/nexus-release-certification/
          if-no-files-found: error
          retention-days: 90

  voice-lifecycle:
    name: Physical voice lifecycle and applications
    needs: release-identity
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    env:
      NEXUS_CERTIFICATION_LANE: voice-lifecycle
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reset retained runner state
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./scripts/nexus-windows-certification-reset.ps1
      - name: Verify physical devices
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./scripts/nexus-windows-real-device-preflight.ps1
      - name: Install locked certification driver
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: npm install --no-save --no-package-lock @playwright/test@1.61.1 esbuild@0.28.1
      - name: Reverify exact deployed release
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: node scripts/nexus-release-certification-controller.js verify-deployment
      - name: Run physical voice and application lane
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: npx playwright test rebuild/tests/nexus-windows-physical-certification.spec.js --workers=1 --reporter=line
      - name: Create authoritative evidence summary
        if: always()
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          NEXUS_CERTIFICATION_OUTCOME: ${{ job.status }}
        run: node scripts/nexus-certification-evidence.js
      - name: Reverify protected foundation
        if: always()
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: node scripts/nexus-protected-foundation-guard.js
      - name: Publish voice evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-v2-voice-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/
            test-results/
          if-no-files-found: error
          retention-days: 90

  guided-entry:
    name: Guided Entry final-screen persistence
    needs: voice-lifecycle
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      NEXUS_CERTIFICATION_LANE: guided-entry
    steps:
      - uses: actions/checkout@v4
      - name: Reset retained runner state
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./scripts/nexus-windows-certification-reset.ps1
      - name: Verify physical devices
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./scripts/nexus-windows-real-device-preflight.ps1
      - name: Install locked certification driver
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: npm install --no-save --no-package-lock @playwright/test@1.61.1
      - name: Reverify exact deployed release
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: node scripts/nexus-release-certification-controller.js verify-deployment
      - name: Run Guided Entry persistence lane
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: npx playwright test rebuild/tests/nexus-windows-voice-form-entry.spec.js --workers=1 --reporter=line
      - name: Create authoritative evidence summary
        if: always()
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          NEXUS_CERTIFICATION_OUTCOME: ${{ job.status }}
        run: node scripts/nexus-certification-evidence.js
      - name: Reverify protected foundation
        if: always()
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: node scripts/nexus-protected-foundation-guard.js
      - name: Publish Guided Entry evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-v2-guided-entry-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/
            test-results/
          if-no-files-found: error
          retention-days: 90

  consecutive-stability:
    name: Three consecutive complete production passes
    needs: guided-entry
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 180
    env:
      NEXUS_CERTIFICATION_LANE: consecutive-stability
      NEXUS_STABILITY_RUNS: "3"
    steps:
      - uses: actions/checkout@v4
      - name: Verify physical devices
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./scripts/nexus-windows-real-device-preflight.ps1
      - name: Install locked certification driver
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: npm install --no-save --no-package-lock @playwright/test@1.61.1 esbuild@0.28.1
      - name: Require three consecutive complete passes
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./scripts/nexus-windows-stability-certification.ps1
      - name: Create authoritative evidence summary
        if: always()
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        env:
          NEXUS_CERTIFICATION_OUTCOME: ${{ job.status }}
        run: node scripts/nexus-certification-evidence.js
      - name: Reverify protected foundation
        if: always()
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: node scripts/nexus-protected-foundation-guard.js
      - name: Publish stability evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-v2-stability-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/
            test-results/
          if-no-files-found: error
          retention-days: 90

