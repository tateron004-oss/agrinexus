name: Nexus live runtime canonical certification

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/nexus-genesis-clean-foundation
    paths:
      - ".github/workflows/nexus-live-runtime-certification.yml"
      - ".github/nexus-protected-foundation.json"
      - "server.js"
      - "rebuild/production-certification-adapter.js"
      - "rebuild/production-capability-bridge-server.js"
      - "rebuild/browser/**"
      - "rebuild/nexus-core/**"
      - "rebuild/tests/**"
      - "scripts/nexus-production-certification-preflight.js"
      - "scripts/nexus-release-certification-controller.js"
      - "scripts/nexus-windows-*.ps1"
      - "scripts/nexus-certification-evidence.js"

permissions:
  contents: read

concurrency:
  group: nexus-windows-physical-certification
  cancel-in-progress: false

env:
  NEXUS_CLEAN_BASE_URL: https://nexus-genesis-certified.onrender.com
  NEXUS_EXPECTED_BUNDLE: rebuild/browser/nexus-clean.bundle.js

jobs:
  deploy-exact-release:
    name: Deploy and verify exact Render release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bind deployment to runtime sources
        shell: bash
        run: |
          RUNTIME_SHA="$(git log -1 --format=%H -- rebuild/browser/nexus-clean.bundle.js)"
          DEPLOYMENT_SHA="$GITHUB_SHA"
          test -n "$RUNTIME_SHA"
          test -n "$DEPLOYMENT_SHA"
          echo "NEXUS_EXPECTED_RELEASE_SHA=$DEPLOYMENT_SHA" >> "$GITHUB_ENV"
          echo "NEXUS_EXPECTED_DEPLOYMENT_SHA=$DEPLOYMENT_SHA" >> "$GITHUB_ENV"
          echo "NEXUS_EXPECTED_RUNTIME_SOURCE_SHA=$RUNTIME_SHA" >> "$GITHUB_ENV"
      - name: Verify deployment automation contract
        run: |
          node scripts/nexus-protected-foundation-guard.js
          node rebuild/tests/nexus-render-deployment-orchestration.test.js
      - name: Trigger exact Render commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: node scripts/nexus-render-deploy.js
      - name: Verify exact deployed release and bundle
        env:
          NEXUS_DEPLOYMENT_TIMEOUT_MS: "900000"
        run: |
          node scripts/nexus-production-certification-preflight.js
          node scripts/nexus-release-certification-controller.js verify-deployment
      - name: Publish deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-render-deployment-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/nexus-release-certification/
          if-no-files-found: warn
          retention-days: 90

  canonical-user-journey:
    name: Complete physical voice user-mode certification
    needs: deploy-exact-release
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind certification to deployed runtime
        shell: cmd
        run: |
          for /f "usebackq delims=" %%S in (`git log -1 --format^=%%H -- rebuild/browser/nexus-clean.bundle.js`) do set "RUNTIME_SHA=%%S"
          set "DEPLOYMENT_SHA=%GITHUB_SHA%"
          if not defined RUNTIME_SHA exit /b 1
          if not defined DEPLOYMENT_SHA exit /b 1
          echo NEXUS_EXPECTED_RELEASE_SHA=%DEPLOYMENT_SHA%>>"%GITHUB_ENV%"
          echo NEXUS_EXPECTED_DEPLOYMENT_SHA=%DEPLOYMENT_SHA%>>"%GITHUB_ENV%"
          echo NEXUS_EXPECTED_RUNTIME_SOURCE_SHA=%RUNTIME_SHA%>>"%GITHUB_ENV%"
          echo Certification spec %GITHUB_SHA% targets deployment %DEPLOYMENT_SHA% and runtime %RUNTIME_SHA%
      - name: Verify certification and protection contracts
        shell: cmd
        run: |
          node scripts/nexus-protected-foundation-guard.js
          node rebuild/tests/nexus-release-certification-controller.test.js
          node rebuild/tests/nexus-production-certification-adapter.test.js
          node rebuild/tests/nexus-live-runtime-certification-workflow.test.js
          node rebuild/tests/nexus-windows-certification-orchestration.test.js
          node rebuild/tests/nexus-capability-transaction-contract.test.js
      - name: Reset retained runner state
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/nexus-windows-certification-reset.ps1
      - name: Verify physical devices
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/nexus-windows-real-device-preflight.ps1
      - name: Install locked certification driver
        shell: cmd
        run: npm install --no-save --no-package-lock @playwright/test@1.61.1 esbuild@0.28.1
      - name: Verify exact live runtime and bundle
        shell: cmd
        run: |
          node scripts/nexus-production-certification-preflight.js
          node scripts/nexus-release-certification-controller.js verify-deployment
      - name: Require three fresh uncached production capability sessions
        shell: cmd
        env:
          NEXUS_PRODUCTION_REPAIR_BASE_URL: https://nexus-genesis-certified.onrender.com
          NEXUS_LIVE_PROVIDER_BASE_URL: https://nexus-genesis-certified.onrender.com
        run: |
          for /L %%I in (1,1,3) do (
            powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/nexus-windows-certification-reset.ps1
            if errorlevel 1 exit /b 1
            set "NEXUS_TRANSACTION_SESSION=session-%%I"
            npx playwright test rebuild/tests/nexus-production-transaction-windows.spec.js --workers=1 --reporter=line
            if errorlevel 1 exit /b 1
            npx playwright test rebuild/tests/nexus-windows-physical-certification.spec.js --workers=1 --reporter=line
            if errorlevel 1 exit /b 1
            xcopy output\nexus-clean-windows-certification output\nexus-production-sessions\session-%%I\ /E /I /Y
            if errorlevel 2 exit /b 1
          )
      - name: Reset before Guided Entry
        shell: cmd
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/nexus-windows-certification-reset.ps1
      - name: Run Guided Entry persistence
        shell: cmd
        env:
          NEXUS_CERTIFICATION_LANE: guided-entry
        run: npx playwright test rebuild/tests/nexus-windows-voice-form-entry.spec.js --workers=1 --reporter=line
      - name: Require three consecutive complete passes
        shell: cmd
        env:
          NEXUS_CERTIFICATION_LANE: consecutive-stability
          NEXUS_STABILITY_RUNS: "3"
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/nexus-windows-stability-certification.ps1
      - name: Create authoritative evidence summary
        if: always()
        shell: cmd
        env:
          NEXUS_CERTIFICATION_OUTCOME: ${{ job.status }}
          NEXUS_CERTIFICATION_LANE: canonical-user-mode
        run: node scripts/nexus-certification-evidence.js
      - name: Reverify protected foundation
        if: always()
        shell: cmd
        run: node scripts/nexus-protected-foundation-guard.js
      - name: Publish canonical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-user-mode-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/
            test-results/
          if-no-files-found: error
          retention-days: 90
