name: Nexus live runtime canonical certification

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/nexus-genesis-clean-foundation
    paths:
      - ".github/workflows/nexus-live-runtime-certification.yml"
      - ".github/nexus-protected-foundation.json"
      - "rebuild/tests/**"
      - "scripts/nexus-windows-*.ps1"
      - "scripts/nexus-certification-evidence.js"

permissions:
  contents: read

concurrency:
  group: nexus-windows-physical-certification
  cancel-in-progress: false

env:
  NEXUS_CLEAN_BASE_URL: https://nexus-genesis-certified.onrender.com
  NEXUS_EXPECTED_BUNDLE: rebuild/browser/nexus-clean.bundle.js

jobs:
  canonical-user-journey:
    name: Complete physical voice user-mode certification
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bind certification to deployed runtime
        shell: powershell
        run: |
          $runtimeSha = git log -1 --format=%H -- rebuild/browser/nexus-clean.bundle.js
          if (-not $runtimeSha) { throw "Unable to resolve runtime commit" }
          "NEXUS_EXPECTED_RELEASE_SHA=$runtimeSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Certification spec $env:GITHUB_SHA targets runtime $runtimeSha"
      - name: Verify certification and protection contracts
        shell: powershell
        run: |
          node scripts/nexus-protected-foundation-guard.js
          node rebuild/tests/nexus-release-certification-controller.test.js
          node rebuild/tests/nexus-windows-certification-orchestration.test.js
      - name: Reset retained runner state
        shell: powershell
        run: ./scripts/nexus-windows-certification-reset.ps1
      - name: Verify physical devices
        shell: powershell
        run: ./scripts/nexus-windows-real-device-preflight.ps1
      - name: Install locked certification driver
        shell: powershell
        run: npm install --no-save --no-package-lock @playwright/test@1.61.1 esbuild@0.28.1
      - name: Verify exact live runtime and bundle
        shell: powershell
        run: node scripts/nexus-release-certification-controller.js verify-deployment
      - name: Run every physical voice application journey
        shell: powershell
        env:
          NEXUS_CERTIFICATION_LANE: voice-lifecycle
        run: npx playwright test rebuild/tests/nexus-windows-physical-certification.spec.js --workers=1 --reporter=line
      - name: Reset before Guided Entry
        shell: powershell
        run: ./scripts/nexus-windows-certification-reset.ps1
      - name: Run Guided Entry persistence
        shell: powershell
        env:
          NEXUS_CERTIFICATION_LANE: guided-entry
        run: npx playwright test rebuild/tests/nexus-windows-voice-form-entry.spec.js --workers=1 --reporter=line
      - name: Require three consecutive complete passes
        shell: powershell
        env:
          NEXUS_CERTIFICATION_LANE: consecutive-stability
          NEXUS_STABILITY_RUNS: "3"
        run: ./scripts/nexus-windows-stability-certification.ps1
      - name: Create authoritative evidence summary
        if: always()
        shell: powershell
        env:
          NEXUS_CERTIFICATION_OUTCOME: ${{ job.status }}
          NEXUS_CERTIFICATION_LANE: canonical-user-mode
        run: node scripts/nexus-certification-evidence.js
      - name: Reverify protected foundation
        if: always()
        shell: powershell
        run: node scripts/nexus-protected-foundation-guard.js
      - name: Publish canonical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-user-mode-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/
            test-results/
          if-no-files-found: error
          retention-days: 90
