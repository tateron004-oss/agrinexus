name: Nexus Protected Foundation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-protected-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  immutable-foundation:
    name: Protected foundation integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Verify golden Nexus foundation
        run: node scripts/nexus-protected-foundation-guard.js

      - name: Confirm protected paths are not changed in pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_BRANCH: ${{ github.head_ref }}
        run: node scripts/nexus-protected-diff-guard.js
