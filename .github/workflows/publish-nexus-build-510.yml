name: Publish Nexus Build 510 transaction repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-nexus-build-510.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply exact tested Build 510 repair
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/nexus-build-510.patch
          git apply --index /tmp/nexus-build-510.patch
          git diff --cached --check
      - name: Install dependencies
        run: npm ci
      - name: Verify transaction pipeline and full safe suite
        run: |
          node --check server.js
          node --check public/app.js
          node scripts/nexus-live-voice-evidence-qa.js
          node scripts/nexus-music-call-production-execution-qa.js
          node scripts/nexus-youtube-music-playback-qa.js
          node scripts/qa-suite.js all-safe
      - name: Publish verified Build 510
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm ".github/workflows/publish-nexus-build-510.yml"
          git commit -m "Unify voice provider transactions and receipts"
          git push origin HEAD:main
