name: Publish Nexus Build 511 acceptable finish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-nexus-build-511.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Verify exact release boundary
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" != ""
          test "$(git rev-parse HEAD^)" = "0fda58387b1df62389121f340e0b814db1c46952"
      - name: Apply exact tested Build 511 repair
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/nexus-build-511.patch
          git apply --index /tmp/nexus-build-511.patch
          git diff --cached --check
      - name: Install dependencies
        run: npm ci
      - name: Verify acceptable-finish pipeline and full safe suite
        run: |
          node --check server.js
          node --check public/app.js
          node --check server/cloudinary-provider.js
          node scripts/nexus-cloudinary-provider-qa.js
          node scripts/nexus-music-call-production-execution-qa.js
          node scripts/nexus-youtube-music-playback-qa.js
          node scripts/qa-suite.js all-safe
      - name: Publish verified Build 511
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm ".github/workflows/publish-nexus-build-511.yml"
          git commit -m "Finish provider voice certification pipeline"
          git push origin HEAD:main

# registration trigger
