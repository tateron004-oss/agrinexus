name: Nexus Windows real-device acceptance

on:
  workflow_run:
    workflows: ["Nexus production voice certification"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXUS_CANONICAL_PRODUCTION_URL: https://agrinexus-platform.onrender.com

concurrency:
  group: nexus-windows-real-device-acceptance
  cancel-in-progress: false

jobs:
  physical-microphone-release-gate:
    name: Physical microphone release gate
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      NEXUS_PROTECTED_BASELINE: 0e3ce5b6
    steps:
      - name: Check out protected release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify protected files before device access
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: node scripts/nexus-protected-foundation-guard.js

      - name: Verify interactive Windows physical audio
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./scripts/nexus-windows-real-device-preflight.ps1

      - name: Verify live Genesis runtime
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          $health = Invoke-RestMethod -Uri "$env:NEXUS_CANONICAL_PRODUCTION_URL/health" -TimeoutSec 30
          if ($health.ok -ne $true -or $health.service -ne "nexus-genesis-clean-voice" -or $health.schema -ne "nexus.clean.health.v1") {
            throw "Production did not return the current Nexus Genesis health contract."
          }

      - name: Install exact dependencies and Chrome driver
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: |
          npm ci
          npm install --no-save --no-package-lock @playwright/test@1.61.1

      - name: Run current Genesis acoustic end-to-end acceptance
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: npx playwright test rebuild/tests/nexus-windows-physical-certification.spec.js --workers=1 --reporter=line
      - name: Verify rendered production capability outcomes
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: npx playwright test rebuild/tests/nexus-production-transaction-windows.spec.js --workers=1 --reporter=line

      - name: Reverify protected files after acceptance
        if: always()
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: node scripts/nexus-protected-foundation-guard.js

      - name: Publish real-device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-real-device-evidence-${{ github.run_id }}
          path: |
            output/nexus-windows-real-device/
            test-results/
          if-no-files-found: error
          retention-days: 90

# Configure this job as a required check for any release labeled voice-ready.
# It automatically follows every successful production voice certification.
# The runner must be started with run.cmd in an interactive signed-in Windows
# desktop session, never installed as a Windows service.

