name: Nexus Windows real-device acceptance

on:
  workflow_run:
    workflows: ["Nexus production voice certification"]
    types: [completed]
  workflow_dispatch:
    inputs:
      base_url:
        description: Protected Nexus production URL
        required: true
        default: https://agrinexus-platform.onrender.com

permissions:
  contents: read

concurrency:
  group: nexus-windows-real-device-acceptance
  cancel-in-progress: false

jobs:
  physical-microphone-release-gate:
    name: Physical microphone release gate
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    env:
      NEXUS_LIVE_BASE_URL: ${{ inputs.base_url || 'https://agrinexus-platform.onrender.com' }}
      NEXUS_PLAYWRIGHT_EMAIL: ${{ secrets.NEXUS_PLAYWRIGHT_EMAIL }}
      NEXUS_PLAYWRIGHT_PASSWORD: ${{ secrets.NEXUS_PLAYWRIGHT_PASSWORD }}
      NEXUS_PROTECTED_BASELINE: 0e3ce5b6
      NEXUS_EXPECTED_RUNTIME: nexus-behavior-502
    steps:
      - name: Check out protected release
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Verify protected files before device access
        shell: powershell
        run: node scripts/nexus-protected-foundation-guard.js

      - name: Verify interactive Windows physical audio
        shell: powershell
        run: ./scripts/nexus-windows-real-device-preflight.ps1

      - name: Verify live protected runtime
        shell: powershell
        run: |
          $health = Invoke-RestMethod -Uri "$env:NEXUS_LIVE_BASE_URL/api/healthz" -TimeoutSec 30
          if ($health.webBuild -ne $env:NEXUS_EXPECTED_RUNTIME) {
            throw "Production runtime is $($health.webBuild); expected $env:NEXUS_EXPECTED_RUNTIME."
          }

      - name: Install exact dependencies and Chrome driver
        shell: powershell
        run: |
          npm ci
          npm install --no-save --no-package-lock @playwright/test@1.61.1

      - name: Run acoustic end-to-end acceptance
        shell: powershell
        run: npx playwright test tests/playwright/nexus-windows-real-device-acceptance.spec.js --workers=1 --reporter=line

      - name: Reverify protected files after acceptance
        if: always()
        shell: powershell
        run: node scripts/nexus-protected-foundation-guard.js

      - name: Publish real-device evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-windows-real-device-evidence-${{ github.run_id }}
          path: |
            output/nexus-windows-real-device/
            test-results/
          if-no-files-found: error
          retention-days: 90

# Configure this job as a required check for any release labeled voice-ready.
# It automatically follows every successful production voice certification.
# The runner must be started with run.cmd in an interactive signed-in Windows
# desktop session, never installed as a Windows service.

