name: Apply Nexus Cloudinary build 497

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/staging/cloudinary-build-497.patch"
      - ".github/workflows/apply-cloudinary-build-497.yml"

permissions:
  contents: write

jobs:
  apply-tested-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact tested Cloudinary release
        run: |
          git apply --index --check .github/staging/cloudinary-build-497.patch
          git apply --index .github/staging/cloudinary-build-497.patch
          git rm .github/staging/cloudinary-build-497.patch
          git rm .github/workflows/apply-cloudinary-build-497.yml
          node --check server.js
          node --check server/cloudinary-provider.js
          node scripts/nexus-cloudinary-provider-qa.js
          node scripts/nexus-google-cloud-translation-provider-qa.js
          test "$(git hash-object public/app.js)" = "4bcd1b71281b921c0ef93993a8d5506f8e57b052"
          test "$(git hash-object server.js)" = "adcdfdcbd4b71a31868ef696e5261b4b634ee4da"

      - name: Publish repaired runtime
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Activate Cloudinary media storage through Nexus voice"
          git push origin HEAD:main

# External Cloudinary release trigger 2026-07-25.

# Pull-request merge trigger.
