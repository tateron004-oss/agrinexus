name: Repair truncated build 496 runtime
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-build496-truncation.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore tested build 496 files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin agent/google-cloud-translation-build-496
          git checkout origin/agent/google-cloud-translation-build-496 -- public/app.js server.js
          git show origin/agent/google-cloud-translation-build-496:.github/build496.patch > /tmp/build496.patch
          git apply --include=public/app.js --include=server.js /tmp/build496.patch
          test "$(git hash-object public/app.js)" = "4ef3ce2a6fc3325eb04d02de3585ec3704468781"
          test "$(git hash-object server.js)" = "bda0a0c221a184a99b006f129a708c3610c21347"
          node --check public/app.js
          node --check server.js
          node scripts/nexus-google-cloud-translation-provider-qa.js
          node scripts/nexus-youtube-data-api-live-provider-qa.js
          git rm .github/workflows/repair-build496-truncation.yml
          git add public/app.js server.js
          git commit -m "Restore complete build 496 runtime files"
          git push origin HEAD:main
