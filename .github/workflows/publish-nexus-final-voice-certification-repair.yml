name: Publish Nexus final voice certification repair

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-nexus-final-voice-certification-repair.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply exact tested repair
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/nexus-final-voice-repair.patch
          git apply --index /tmp/nexus-final-voice-repair.patch
          git diff --cached --check
      - name: Install dependencies
        run: npm ci
      - name: Verify focused repair and full safe suite
        run: |
          node --check public/app.js
          node scripts/nexus-genesis-voice-workspace-bridge-qa.js
          node scripts/nexus-live-voice-evidence-qa.js
          node scripts/nexus-music-call-production-execution-qa.js
          node scripts/qa-suite.js all-safe
      - name: Publish verified repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm ".github/workflows/publish-nexus-final-voice-certification-repair.yml"
          git commit -m "Make Realtime provider voice execution deterministic"
          git push origin HEAD:main
