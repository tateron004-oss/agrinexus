name: Publish Nexus build 494 and certify voice

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-build-494-and-certify.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Apply approved build 494 repair
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/build-494.patch
          git apply --check /tmp/build-494.patch
          git apply /tmp/build-494.patch
          git rm ".github/workflows/publish-build-494-and-certify.yml"
      - name: Validate protected voice architecture
        shell: bash
        run: |
          npm ci
          node --check server.js
          node --check public/app.js
          node --check public/nexus-openai-realtime-agent.js
          npm run qa:nexus-genesis-voice-workspace-bridge
          npm run qa:nexus-genesis-realtime-production-migration
          npm run qa:nexus-realtime-microphone-visibility
          npm run qa:nexus-genesis-persistent-voice-lifecycle
          npm run qa:nexus-service-worker-cache-safety
      - name: Publish exact repair to main
        id: commit
        shell: bash
        run: |
          git config user.name "AgriNexus Release"
          git config user.email "actions@users.noreply.github.com"
          git add public server.js scripts
          git commit -m "Repair Realtime voice workspace handoff"
          git push origin HEAD:main
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  certify:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXUS_LIVE_BASE_URL: https://agrinexus-platform.onrender.com
      NEXUS_LIVE_EXPECTED_TURNS: "13"
      NEXUS_LIVE_REQUIRE_WORKSPACES: "1"
      NEXUS_LIVE_REQUIRED_INTERRUPTION_COUNT: "0"
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.publish.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install synthetic speech support
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libflite1
      - name: Wait for exact Render build 494
        run: |
          expected_build=$(node -e "const source=require('fs').readFileSync('server.js','utf8'); const match=source.match(/AGRINEXUS_WEB_BUILD_VERSION = \"([^\"]+)\"/); if (!match) process.exit(1); process.stdout.write(match[1]);")
          for attempt in $(seq 1 90); do
            live_build=$(curl --max-time 20 -fsSL "$NEXUS_LIVE_BASE_URL/api/healthz" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk).on('end', () => { try { process.stdout.write(JSON.parse(data).webBuild || '') } catch {} })")
            if [ "$live_build" = "$expected_build" ]; then
              echo "Render is serving $live_build"
              exit 0
            fi
            echo "Waiting for Render: expected $expected_build, received ${live_build:-unavailable}"
            sleep 10
          done
          exit 1
      - run: npm run qa:nexus-genesis-production-exact-build-smoke
      - name: Drive all 13 spoken production workflows
        run: npm run qa:nexus-genesis-live-provider-browser-smoke
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-build-494-production-voice-evidence-${{ github.run_id }}
          path: |
            output/nexus-live-voice-acceptance/
            output/nexus-certification/
          if-no-files-found: warn
          retention-days: 30
