name: Restore Nexus call runtime sources
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/emergency-restore-call-runtime.yml
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore verified sources and apply call repair
        shell: bash
        run: |
          git checkout 65b0304589d01eaa416c21120508085020a53ada -- public/app.js server.js
          node <<'NODE'
          const fs = require("fs");
          let server = fs.readFileSync("server.js", "utf8");
          server = server.replace(
            '  if (direct) return direct;\n  if (/(buyer|seller|trade|crop|order|delivery)/.test(lower)) {',
            '  if (direct) return direct;\n  const ownerRecipientRequested = body.ownerTestRecipient === true\n    || /^(?:the\\s+)?owner test recipient$/i.test(String(body.contactName || body.targetLabel || "").trim())\n    || /\\bowner test recipient\\b/i.test(String(purpose || ""));\n  if (ownerRecipientRequested) {\n    return normalizePhoneNumber(firstPresentEnvValue(process.env, ["OWNER_TEST_RECIPIENT_NUMBER", "TEST_RECIPIENT_NUMBER"]));\n  }\n  if (/(buyer|seller|trade|crop|order|delivery)/.test(lower)) {'
          );
          server = server.replace(
            '      contactName: pending.contactName || targetLabel\n    });',
            '      contactName: pending.contactName || targetLabel,\n      ownerTestRecipient: target.displayName === "owner test recipient"\n    });'
          );
          server = server.replace(
            '    const body = await readBody(req);\n    const record = await createOutboundCallWorkflow(db, user, body);\n    await writeDb(db);',
            '    const body = await readBody(req);\n    if (body.confirmed !== true) {\n      return send(res, 409, {\n        ok: false,\n        status: "confirmation-required",\n        requiresConfirmation: true,\n        noCallPlaced: true,\n        error: "Explicit confirmation is required before an outbound call."\n      });\n    }\n    const record = await createOutboundCallWorkflow(db, user, body);\n    await writeDb(db);'
          );
          fs.writeFileSync("server.js", server);
          let app = fs.readFileSync("public/app.js", "utf8");
          app = app.replace(
            '          message: "This is AgriNexus calling. You can speak after the greeting and the AI assistant will help route the next step."\n',
            '          message: "This is AgriNexus calling. You can speak after the greeting and the AI assistant will help route the next step.",\n          confirmed: true\n'
          );
          fs.writeFileSync("public/app.js", app);
          NODE
          node scripts/nexus-owner-call-production-wiring-qa.js
          node scripts/call-provider-registry-qa.js
          git diff --check
          git config user.name "Nexus Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/app.js server.js
          git commit -m "Restore full call runtime sources"
          git push origin HEAD:main
