name: Nexus unified production release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      expected_release_sha:
        description: Exact main SHA to deploy and certify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nexus-unified-production-release
  cancel-in-progress: false

env:
  EXPECTED_RELEASE_SHA: ${{ inputs.expected_release_sha || github.sha }}
  NEXUS_BASE_URL: https://nexus-genesis-certified.onrender.com
  PROVIDER_BASE_URL: https://agrinexus-provider-engines.onrender.com

jobs:
  deploy-activate-accept:
    name: Deploy, activate, and establish exact-SHA acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_release_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked production dependencies
        run: npm ci --ignore-scripts
      - name: Require machine deployment control
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          test -n "$RENDER_API_KEY" || { echo "RENDER_API_KEY is not installed" >&2; exit 1; }
          test "$(git rev-parse HEAD)" = "$EXPECTED_RELEASE_SHA"
      - name: Validate unified release contracts
        run: |
          node test/nexus/system-convergence.test.js
          node test/nexus/production-acceptance-gate.test.js
          node test/nexus/production-acceptance-repository.test.js
          node test/nexus/production-evidence-producer.test.js
          node test/nexus/production-evidence-probes.test.js
          node test/nexus/production-identity-probe.test.js
          node test/nexus/production-observability-probe.test.js
          node test/nexus/production-object-storage-probe.test.js
          node test/nexus/production-task-engine-probe.test.js
          node test/nexus/production-semantic-memory-probe.test.js
          node test/nexus/production-consent-audit-probe.test.js
          node test/nexus/production-offline-sync-probe.test.js
          node test/nexus/offline-cutover.test.js
          node test/nexus/observability-alert-evaluator.test.js
          node test/nexus/worker-release-heartbeat.test.js
          node test/nexus/server-runtime-adapter.test.js
          node test/nexus/render-release-controller.test.js
          node scripts/nexus-protected-foundation-guard.js
      - name: Deploy exact SHA to the canonical Render topology
        id: render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/nexus-render-release-controller.js
      - name: Produce, compile, and record exact-release production probes
        env:
          NEXUS_PROBE_FILE: output/nexus-production-probes.json
          NEXUS_PROOF_FILE: output/nexus-production-proof.json
          NEXUS_ROLLBACK_REF: refs/heads/main@${{ github.event.before || github.sha }}
        run: |
          node scripts/nexus-run-production-evidence-probes.js
          node scripts/nexus-compile-production-evidence.js
          node scripts/nexus-record-production-proof.js
      - name: Establish three consecutive production passes
        run: |
          set -euo pipefail
          for pass in 1 2 3; do
            echo "Starting exact-SHA production acceptance pass ${pass}/3"
            NEXUS_PASS_NUMBER="$pass" node scripts/nexus-21-objective-production-acceptance.js
            if [ "$pass" -lt 3 ]; then sleep 120; fi
          done
          node - <<'NODE'
          const fs=require('fs');
          const reports=[1,2,3].map(n=>JSON.parse(fs.readFileSync(`output/nexus-21-objective-pass-${n}.json`)));
          if(!reports.every(r=>r.passed&&r.releaseSha===process.env.EXPECTED_RELEASE_SHA)) throw new Error('Exact-SHA 3/3 streak not established.');
          fs.writeFileSync('output/nexus-21-objective-streak.json',JSON.stringify({certificationComplete:true,passes:3,releaseSha:process.env.EXPECTED_RELEASE_SHA,completedAt:new Date().toISOString()},null,2));
          NODE
      - name: Publish unified release evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-unified-production-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: error
          retention-days: 90
