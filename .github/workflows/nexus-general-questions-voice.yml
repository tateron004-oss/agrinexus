name: Nexus general questions physical voice gauntlet

on:
  push:
    branches: [rebuild/nexus-genesis-clean-foundation]
    paths:
      - rebuild/tests/nexus-general-questions-physical-voice.spec.js
      - .github/workflows/nexus-general-questions-voice.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nexus-windows-physical-certification
  cancel-in-progress: false

jobs:
  general-questions:
    name: General questions through physical Nexus voice
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 100
    env:
      NEXUS_CLEAN_BASE_URL: https://nexus-genesis-certified.onrender.com
      NEXUS_EXPECTED_RELEASE_SHA: 6aadc254bd2cd6ca98fe7ff77ba63e8f3d22d7fb
      NEXUS_EXPECTED_BUNDLE: rebuild/browser/nexus-clean.bundle.js
    steps:
      - uses: actions/checkout@v4
      - name: Reset retained runner state
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./scripts/nexus-windows-certification-reset.ps1
      - name: Verify physical devices
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./scripts/nexus-windows-real-device-preflight.ps1
      - name: Install certification driver
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: npm install --no-save --no-package-lock @playwright/test@1.61.1
      - name: Verify exact certified production release
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: node scripts/nexus-release-certification-controller.js verify-deployment
      - name: Run all general-question prompts through voice
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: npx playwright test rebuild/tests/nexus-general-questions-physical-voice.spec.js --workers=1 --reporter=line
      - name: Reverify protected foundation
        if: always()
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: node scripts/nexus-protected-foundation-guard.js
      - name: Publish general-question evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-general-questions-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            output/nexus-general-questions-voice/
            output/nexus-windows-real-device/
            test-results/
          if-no-files-found: error
          retention-days: 90
