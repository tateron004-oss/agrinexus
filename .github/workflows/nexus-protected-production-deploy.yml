name: Nexus protected production deployment

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact main-branch commit SHA to deploy and verify
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nexus-genesis-certified-production
  cancel-in-progress: false

env:
  PRODUCTION_ORIGIN: https://nexus-genesis-certified.onrender.com

jobs:
  qualify-release-candidate:
    name: Prove release candidate before production
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: nexus_candidate
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_candidate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_candidate"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://nexus:nexus_candidate@127.0.0.1:5432/nexus_candidate
      DATABASE_SSL: "false"
      AGRINEXUS_STATE_STORE: postgres
      NEXUS_ACCEPTANCE_TOKEN: candidate-only-token
      NEXUS_DISABLE_LOCAL_ENV_FILES: "true"
      RENDER_GIT_COMMIT: ${{ github.event.inputs.target_sha || github.sha }}
      PORT: "4173"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install immutable dependencies
        run: npm ci --ignore-scripts
      - name: Install candidate browser
        run: |
          npm install --prefix /tmp/nexus-playwright --no-save --no-package-lock playwright@1.55.0
          ln -s /tmp/nexus-playwright/node_modules/playwright node_modules/playwright
          ln -s /tmp/nexus-playwright/node_modules/playwright-core node_modules/playwright-core
          /tmp/nexus-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Prove source and release contracts
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RENDER_GIT_COMMIT"
          node scripts/nexus-protected-foundation-guard.js
          node --test test/nexus/system-convergence.test.js
          node --test test/nexus/open-ended-agent.test.js
          node --test test/nexus/fault-register.test.js
          node --test test/nexus/fault-verifier-registry.test.js
          node --test test/nexus/external-fault-proof-assembler.test.js
          node --test test/nexus/production-evidence-producer.test.js
          node --test test/nexus/production-release-readiness.test.js
          node --test test/nexus/release-promotion-policy.test.js
          npm run qa:nexus-browser-action-controller
          npm run qa:nexus-production-layer-activation-integration
          node test/nexus/server-runtime-adapter.test.js
          node test/nexus/render-release-controller.test.js
      - name: Execute source-backed fault verifiers and preserve open production obligations
        env:
          EXPECTED_RELEASE_SHA: ${{ github.event.inputs.target_sha || github.sha }}
          NEXUS_FAULT_PROOF_FILE: output/nexus-candidate-fault-proof-report.json
          NEXUS_FAULT_ALLOW_OPEN: "true"
        run: |
          set -euo pipefail
          mkdir -p output
          node scripts/nexus-run-fault-proof-verifiers.js
          node - <<'NODE'
          const report=require("./output/nexus-candidate-fault-proof-report.json");
          if(report.closed!==false||report.proven!==20||report.open.length!==10) {
            throw new Error(`Unexpected candidate fault inventory: ${report.proven}/${report.required}, open=${report.open.length}`);
          }
          NODE
      - name: Install production-equivalent provider contract
        run: node -e 'const fs=require("node:fs");const {canonicalToolProviders}=require("./scripts/nexus-render-release-controller.js");fs.appendFileSync(process.env.GITHUB_ENV,"NEXUS_TOOL_PROVIDERS_JSON="+JSON.stringify(canonicalToolProviders("candidate-provider-receipt-secret-0000000000000000","https://provider.example"))+"\n")'
      - name: Migrate production-equivalent PostgreSQL
        run: npm run foundation:migrate
      - name: Boot exact candidate and prove it as a black box
        run: |
          set -euo pipefail
          mkdir -p output
          node server.js > output/candidate-server.log 2>&1 &
          echo $! > output/candidate-server.pid
          trap 'kill "$(cat output/candidate-server.pid)" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            curl --fail --silent http://127.0.0.1:4173/api/healthz > output/candidate-health.json && break
            sleep 2
          done
          node scripts/nexus-preproduction-black-box.js
      - name: Preserve candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-qualified-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/
          if-no-files-found: error
          retention-days: 180

  deploy-exact-release:
    if: github.event_name != 'pull_request'
    name: Deploy and verify exact production release
    needs: qualify-release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nexus-genesis-certified
    steps:
      - name: Resolve immutable target
        id: target
        env:
          REQUESTED_SHA: ${{ github.event.inputs.target_sha }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          target="${REQUESTED_SHA:-$EVENT_SHA}"
          if ! [[ "$target" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Target must be a full 40-character commit SHA."
            exit 1
          fi
          echo "sha=$target" >> "$GITHUB_OUTPUT"
          echo "short=${target:0:12}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install immutable deployment controller
        run: npm ci --ignore-scripts
      - name: Install production verification browser
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Confirm target is current main
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          git fetch --quiet --depth=1 origin main
          main_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$TARGET_SHA" != "$main_sha" ]; then
            echo "::error::Refusing deployment: target $TARGET_SHA is not current main $main_sha."
            exit 1
          fi

      - name: Require protected Render API control
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error::Repository environment nexus-genesis-certified is missing RENDER_API_KEY."
            exit 1
          fi

      - name: Reconcile topology and deploy the exact release
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          EXPECTED_RELEASE_SHA: ${{ steps.target.outputs.sha }}
          NEXUS_BASE_URL: ${{ env.PRODUCTION_ORIGIN }}
          NEXUS_RELEASE_OUTPUT: render-deploy-response.json
        run: node scripts/nexus-render-release-controller.js

      - name: Wait for exact release identity
        env:
          TARGET_SHA: ${{ steps.target.outputs.sha }}
          TARGET_SHORT: ${{ steps.target.outputs.short }}
        run: |
          set -euo pipefail
          matched=""
          for attempt in $(seq 1 90); do
            for path in /api/healthz /api/release /api/version; do
              body="$(curl --silent --show-error --connect-timeout 10 --max-time 20 "$PRODUCTION_ORIGIN$path" || true)"
              printf '%s' "$body" > "production-response-${path//\//_}.json"
              if printf '%s' "$body" | grep -Fqi "$TARGET_SHA" || printf '%s' "$body" | grep -Fqi "$TARGET_SHORT"; then
                matched="$path"
                break 2
              fi
            done
            echo "Attempt $attempt/90: production has not reported $TARGET_SHORT yet."
            sleep 15
          done
          if [ -z "$matched" ]; then
            echo "::error::Production became reachable but never reported exact release $TARGET_SHA."
            exit 1
          fi
          echo "Exact release $TARGET_SHA verified through $matched."
          {
            echo
            echo "### Exact release verified"
            echo
            echo "- Production: $PRODUCTION_ORIGIN"
            echo "- Commit: \`$TARGET_SHA\`"
            echo "- Identity endpoint: \`$matched\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Re-prove deployed Standard User behavior
        env:
          RENDER_GIT_COMMIT: ${{ steps.target.outputs.sha }}
          NEXUS_CANDIDATE_URL: ${{ env.PRODUCTION_ORIGIN }}
        run: node scripts/nexus-preproduction-black-box.js

      - name: Produce and record exact-release production evidence
        env:
          EXPECTED_RELEASE_SHA: ${{ steps.target.outputs.sha }}
          NEXUS_BASE_URL: ${{ env.PRODUCTION_ORIGIN }}
          PROVIDER_BASE_URL: https://agrinexus-provider-engines.onrender.com
          NEXUS_PROBE_FILE: output/nexus-production-probes.json
          NEXUS_PROOF_FILE: output/nexus-production-proof.json
          NEXUS_SECURITY_AUDIT_FILE: output/nexus-production-security-audit.json
          NEXUS_FAULT_PROOF_FILE: output/nexus-fault-proof-report.json
          NEXUS_EXTERNAL_FAULT_PROOFS: output/nexus-external-fault-proofs.json
          NEXUS_BLACK_BOX_FILE: output/nexus-preproduction-black-box.json
          NEXUS_CANDIDATE_RESULT: ${{ needs.qualify-release-candidate.result }}
          NEXUS_CANDIDATE_GATES_PASSED: ${{ needs.qualify-release-candidate.result == 'success' }}
          NEXUS_PIPELINE_OWNER: github-actions
          NEXUS_PIPELINE_RUN_ID: ${{ github.run_id }}
          NEXUS_FAULT_EXECUTION_ID: production-${{ github.run_id }}-${{ github.run_attempt }}
          NEXUS_ROLLBACK_REF: refs/heads/main@${{ github.event.before || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p output
          npm audit --omit=dev --json > output/nexus-production-security-audit.json
          node scripts/nexus-run-production-evidence-probes.js 2>&1 | tee output/nexus-production-probe-run.log
          node scripts/nexus-run-browser-capability-probes.js 2>&1 | tee output/nexus-browser-capability-probe-run.log
          node scripts/nexus-assemble-external-fault-proofs.js 2>&1 | tee output/nexus-external-fault-proof-run.log
          node scripts/nexus-run-fault-proof-verifiers.js 2>&1 | tee output/nexus-fault-verifier-run.log
          node scripts/nexus-compile-production-evidence.js
          node scripts/nexus-record-production-proof.js

      - name: Capture sanitized authoritative runtime failure logs
        if: failure()
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          EXPECTED_RELEASE_SHA: ${{ steps.target.outputs.sha }}
        run: node scripts/nexus-capture-render-runtime-diagnostics.js

      - name: Run three consecutive authenticated exact-SHA production passes
        env:
          EXPECTED_RELEASE_SHA: ${{ steps.target.outputs.sha }}
          NEXUS_BASE_URL: ${{ env.PRODUCTION_ORIGIN }}
          PROVIDER_BASE_URL: https://agrinexus-provider-engines.onrender.com
        run: |
          set -euo pipefail
          mkdir -p output
          for pass in 1 2 3; do
            echo "Starting exact-SHA production acceptance pass ${pass}/3"
            NEXUS_PASS_NUMBER="$pass" node scripts/nexus-21-objective-production-acceptance.js
            if [ "$pass" -lt 3 ]; then sleep 120; fi
          done
          node - <<'NODE'
          const fs=require('fs');
          const reports=[1,2,3].map(n=>JSON.parse(fs.readFileSync(`output/nexus-21-objective-pass-${n}.json`)));
          if(!reports.every(r=>r.passed&&r.releaseSha===process.env.EXPECTED_RELEASE_SHA)) throw new Error('Exact-SHA 3/3 streak not established. Certification remains incomplete.');
          fs.writeFileSync('output/nexus-21-objective-streak.json',JSON.stringify({certificationComplete:true,passes:3,releaseSha:process.env.EXPECTED_RELEASE_SHA,completedAt:new Date().toISOString()},null,2));
          NODE

      - name: Preserve deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-production-deployment-${{ steps.target.outputs.short }}
          path: |
            render-deploy-response.json
            production-response-*.json
            output/nexus-preproduction-black-box.json
            output/nexus-production-*.json
            output/nexus-production-*.log
            output/nexus-browser-capability-probe-run.log
            output/nexus-21-objective-*.json
          if-no-files-found: warn
          retention-days: 30
