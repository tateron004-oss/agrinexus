name: Nexus production voice certification

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"
      - "server.js"
      - "server/**"
      - "package.json"
      - "scripts/qa-suite.js"
      - "scripts/nexus-youtube-data-api-live-provider-qa.js"
      - "scripts/nexus-google-cloud-translation-provider-qa.js"
      - "scripts/nexus-cloudinary-provider-qa.js"
      - "scripts/nexus-music-call-production-execution-qa.js"
      - "scripts/nexus-genesis-live-provider-browser-smoke.js"
      - ".github/workflows/nexus-production-voice-certification.yml"

permissions:
  contents: read

concurrency:
  group: nexus-production-voice-certification
  cancel-in-progress: true

jobs:
  deployed-voice-to-workspace:
    name: Real Realtime voice to visible workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXUS_LIVE_BASE_URL: https://agrinexus-platform.onrender.com
      NEXUS_LIVE_EXPECTED_TURNS: "18"
      NEXUS_LIVE_REQUIRE_WORKSPACES: "1"
      NEXUS_LIVE_REQUIRED_INTERRUPTION_COUNT: "0"
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - name: Check out the deployed source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install synthetic speech support
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libflite1

      - name: Wait for the exact Render release
        id: release
        run: |
          expected_build=$(node -e "const source=require('fs').readFileSync('server.js','utf8'); const match=source.match(/AGRINEXUS_WEB_BUILD_VERSION = \"([^\"]+)\"/); if (!match) process.exit(1); process.stdout.write(match[1]);")
          echo "expected_build=$expected_build" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 180); do
            live_build=$(curl --max-time 20 -fsSL "$NEXUS_LIVE_BASE_URL/api/healthz" | node -e "let data=''; process.stdin.on('data', chunk => data += chunk).on('end', () => { try { process.stdout.write(JSON.parse(data).webBuild || '') } catch {} })")
            if [ "$live_build" = "$expected_build" ]; then
              echo "Render is serving $live_build"
              exit 0
            fi
            echo "Waiting for Render: expected $expected_build, received ${live_build:-unavailable}"
            sleep 10
          done
          echo "Render did not deploy $expected_build within the certification window"
          exit 1

      - name: Verify production release markers
        id: release_markers
        run: npm run qa:nexus-genesis-production-exact-build-smoke

      - name: Verify music playback and call receipt execution contracts
        id: execution_contracts
        run: npm run qa:nexus-music-call-production-execution

      - name: Drive every spoken production workflow
        id: voice
        continue-on-error: true
        run: |
          set +e
          npm run qa:nexus-genesis-live-provider-browser-smoke 2>&1 | tee /tmp/nexus-voice-result.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            summary=$(tail -n 1 /tmp/nexus-voice-result.log | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
            echo "::error title=Nexus voice evidence::$summary"
          fi
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Require complete structured voice evidence
        id: voice_evidence
        if: always() && steps.voice.outcome == 'success'
        run: |
          node -e 'const {readAndValidateEvidence}=require("./scripts/nexus-live-voice-evidence"); readAndValidateEvidence("output/nexus-live-voice-acceptance/live-provider-browser-evidence.json", Number(process.env.NEXUS_LIVE_EXPECTED_TURNS));'

      - name: Record concise certification result
        if: always()
        shell: bash
        run: |
          mkdir -p output/nexus-certification
          node -e 'const fs=require("fs"); const [build,sha,release,markers,contracts,voice,evidence]=process.argv.slice(1); const p="/tmp/nexus-voice-result.log"; const log=fs.existsSync(p)?fs.readFileSync(p,"utf8"):""; const tail=log.trim().split(/\r?\n/).filter(Boolean).slice(-20); const stages={release,releaseMarkers:markers,executionContracts:contracts,voice,voiceEvidence:evidence}; const outcome=Object.values(stages).every(value=>value==="success")?"success":"failure"; fs.writeFileSync(`output/nexus-certification/live-${sha}-result.json`,JSON.stringify({build:build||"unknown",workflowCommit:sha,outcome,stages,recordedAt:new Date().toISOString(),diagnosticTail:tail},null,2)+"\n")' \
            "${{ steps.release.outputs.expected_build }}" \
            "${{ github.sha }}" \
            "${{ steps.release.outcome }}" \
            "${{ steps.release_markers.outcome }}" \
            "${{ steps.execution_contracts.outcome }}" \
            "${{ steps.voice.outcome }}" \
            "${{ steps.voice_evidence.outcome }}"

      - name: Publish certification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-production-voice-evidence-${{ github.run_id }}
          path: |
            output/nexus-live-voice-acceptance/
            output/nexus-certification/
          if-no-files-found: error
          retention-days: 30

      - name: Enforce spoken certification outcome
        if: always() && (steps.voice.outcome != 'success' || steps.voice_evidence.outcome != 'success')
        run: exit 1

# Build metadata is resolved from server.js so certification cannot drift from the release.
