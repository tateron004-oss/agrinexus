name: Nexus voice-assisted form certification

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/nexus-genesis-clean-foundation

permissions:
  contents: read

concurrency:
  group: nexus-voice-form-entry-certification
  cancel-in-progress: true

jobs:
  protected-foundation:
    name: Protected foundation and form contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock esbuild@0.28.1
      - run: |
          node rebuild/tests/nexus-voice-form-entry.test.js
          node rebuild/scripts/build-browser.js
          git diff --exit-code -- rebuild/browser/nexus-clean.bundle.js
          node scripts/nexus-protected-foundation-guard.js

  windows-production:
    name: Windows physical voice-assisted form entry
    needs: protected-foundation
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 25
    env:
      NEXUS_CLEAN_BASE_URL: https://nexus-genesis-certified.onrender.com
    steps:
      - uses: actions/checkout@v4
      - name: Verify interactive physical audio
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: ./scripts/nexus-windows-real-device-preflight.ps1
      - name: Install certification driver
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: npm install --no-save --no-package-lock @playwright/test@1.61.1
      - name: Certify production voice-assisted form entry
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: npx playwright test rebuild/tests/nexus-windows-voice-form-entry.spec.js --workers=1 --reporter=line
      - name: Reverify protected foundation
        if: always()
        shell: powershell -NoLogo -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
        run: node scripts/nexus-protected-foundation-guard.js
      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexus-voice-form-entry-${{ github.run_id }}
          path: |
            output/nexus-voice-form-certification/
            test-results/
          if-no-files-found: warn
          retention-days: 90
