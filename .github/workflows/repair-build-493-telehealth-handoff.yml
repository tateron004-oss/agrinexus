name: Repair Nexus build 493 Telehealth handoff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-build-493-telehealth-handoff.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Apply Telehealth handoff repair
        run: node scripts/apply-build-493-telehealth-handoff.js
      - name: Validate release integrity
        run: |
          git diff --check
          node --check public/app.js
          node --check server.js
          node --check scripts/nexus-genesis-live-provider-browser-smoke.js
          npm run qa:nexus-genesis-voice-workspace-bridge
          npm run qa:nexus-genesis-browser-voice-acceptance
          npm run qa:nexus-service-worker-cache-safety
          npm run qa:nexus-genesis-realtime-production-migration
          npm run qa:nexus-genesis-persistent-voice-lifecycle
      - name: Publish build 493
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/index.html public/sw.js server.js scripts
          git commit -m "Preserve spoken Telehealth location through routing"
          git push origin main
