name: Repair Nexus build 493 Telehealth handoff

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-build-493-telehealth-handoff.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Preserve final spoken entities through delayed tool completion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          roots = [Path("public/app.js"), Path("public/index.html"), Path("public/sw.js"), Path("server.js")]
          roots.extend(Path("scripts").glob("*.js"))
          for path in roots:
              text = path.read_text(encoding="utf-8")
              text = text.replace("nexus-behavior-492", "nexus-behavior-493")
              text = text.replace("agrinexus-pwa-v437", "agrinexus-pwa-v438")
              if path == Path("public/app.js"):
                  old = "Date.now() - route.at > 15000"
                  assert old in text, "Realtime route expiry seam was not found"
                  text = text.replace(old, "Date.now() - route.at > 45000", 1)
              path.write_text(text, encoding="utf-8")

          qa = Path("scripts/nexus-genesis-voice-workspace-bridge-qa.js")
          text = qa.read_text(encoding="utf-8")
          old = """app.includes('source: "realtime-workspace-transition"')"""
          assert old in text, "stale map-transition assertion was not found"
          text = text.replace(old, """!app.includes('source: "realtime-workspace-transition"')""", 1)
          marker = "final transcript entities survive delayed Realtime tool completion"
          if marker not in text:
              text += """
checks.push(['final transcript entities survive delayed Realtime tool completion',app.includes('Date.now() - route.at > 45000')&&app.includes('payload: { ...(action.payload || {}), ...(route.action.payload || {}) }')]);
"""
          qa.write_text(text, encoding="utf-8")
          PY
      - name: Validate release integrity
        run: |
          git diff --check
          node --check public/app.js
          node --check server.js
          node --check scripts/nexus-genesis-live-provider-browser-smoke.js
          npm run qa:nexus-genesis-voice-workspace-bridge
          npm run qa:nexus-genesis-browser-voice-acceptance
          npm run qa:nexus-service-worker-cache-safety
          npm run qa:nexus-genesis-realtime-production-migration
          npm run qa:nexus-genesis-persistent-voice-lifecycle
      - name: Publish build 493
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/app.js public/index.html public/sw.js server.js scripts
          git commit -m "Preserve spoken Telehealth location through routing"
          git push origin main
